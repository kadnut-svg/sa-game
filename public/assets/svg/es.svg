    <rect x="14" y="58" width="74" height="16" rx="4" fill="#6b21a8"/>
    <text x="51" y="69" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9">RULE #104: HIGH</text>
    <rect x="14" y="82" width="74" height="16" rx="4" fill="#6b21a8"/>
    <text x="51" y="93" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9">EXPERT DOMAIN</text>
  </g>

