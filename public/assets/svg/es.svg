  <rect x="16" y="186" width="328" height="24" rx="6" fill="#3b0764" opacity="0.9"/>
  <text x="180" y="202" text-anchor="middle" fill="#e9d5ff" font-family="sans-serif" font-size="12" font-weight="bold">
    ES / AI • ระบบผู้เชี่ยวชาญและปัญญาประดิษฐ์ (Knowledge &amp; Inference)
