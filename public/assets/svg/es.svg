    <!-- Neural Network Nodes -->
    <line x1="-14" y1="-12" x2="14" y2="12" stroke="#e9d5ff" stroke-width="1.8"/>
    <line x1="-14" y1="12" x2="14" y2="-12" stroke="#e9d5ff" stroke-width="1.8"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#e9d5ff" stroke-width="1.8"/>
    <circle cx="-14" cy="-12" r="5" fill="#c084fc"/>
    <circle cx="14" cy="-12" r="5" fill="#38bdf8"/>
    <circle cx="-14" cy="12" r="5" fill="#34d399"/>
    <circle cx="14" cy="12" r="5" fill="#f43f5e"/>
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    <text x="0" y="52" text-anchor="middle" fill="#e9d5ff" font-family="sans-serif" font-size="10" font-weight="bold">Inference Engine</text>
