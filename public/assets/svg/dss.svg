<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%">
  <defs>
    <linearGradient id="dssBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <rect width="360" height="220" rx="16" fill="url(#dssBg)" stroke="#f59e0b" stroke-width="2"/>

  <!-- Left: Interactive What-if Parameter Sliders -->
  <g transform="translate(28, 34)">
    <rect width="128" height="136" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="64" y="22" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">What-If Parameters</text>
    <!-- Slider 1 -->
    <line x1="18" y1="48" x2="110" y2="48" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="82" cy="48" r="7" fill="#fbbf24"/>
    <!-- Slider 2 -->
    <line x1="18" y1="78" x2="110" y2="78" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="46" cy="78" r="7" fill="#34d399"/>
    <!-- Slider 3 -->
    <line x1="18" y1="108" x2="110" y2="108" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="94" cy="108" r="7" fill="#38bdf8"/>
  </g>

  <!-- Right: Simulation & Forecasting Curves -->
  <g transform="translate(172, 34)">
    <rect width="160" height="136" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="80" y="22" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">Scenario Simulation</text>
    <!-- Scenario A (Optimal) -->
    <path d="M18,112 Q60,95 95,62 T144,38" fill="none" stroke="#34d399" stroke-width="3"/>
    <!-- Scenario B (Baseline) -->
    <path d="M18,112 Q65,102 98,84 T144,72" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5,3"/>
    <!-- Scenario C (Risk) -->
    <path d="M18,112 Q70,110 104,104 T144,108" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="144" cy="38" r="5" fill="#34d399"/>
  </g>

  <rect x="16" y="186" width="328" height="24" rx="6" fill="#451a03" opacity="0.9"/>
  <text x="180" y="202" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="bold">
    DSS • ระบบสนับสนุนการตัดสินใจ (What-If &amp; Simulation)
  </text>
</svg>
