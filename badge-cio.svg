<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Outer Glow Ring -->
  <circle cx="100" cy="100" r="90" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Shield Body -->
  <path d="M100,28 L154,50 L154,104 C154,138 128,162 100,174 C72,162 46,138 46,104 L46,50 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3.5"/>

  <!-- Mini Golden Pyramid Inside Shield -->
  <polygon points="100,56 132,116 68,116" fill="url(#goldGrad)" opacity="0.9"/>
  <line x1="84" y1="86" x2="116" y2="86" stroke="#0f172a" stroke-width="2"/>
  <line x1="76" y1="101" x2="124" y2="101" stroke="#0f172a" stroke-width="2"/>

  <!-- Banner Ribbon -->
  <rect x="44" y="130" width="112" height="26" rx="8" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>
  <text x="100" y="147" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">
    IS ARCHITECT
  </text>
</svg>
