<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%">
  <defs>
    <linearGradient id="eisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
  </defs>

  <rect width="360" height="220" rx="16" fill="url(#eisBg)" stroke="#f43f5e" stroke-width="2"/>

  <!-- Executive Dashboard Frame -->
  <rect x="26" y="26" width="308" height="148" rx="12" fill="#0f172a" stroke="#fb7185" stroke-width="2"/>
  <rect x="26" y="26" width="308" height="24" rx="10" fill="#e11d48"/>
  <text x="180" y="42" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">
    EXECUTIVE STRATEGIC DASHBOARD (5-YEAR VISION &amp; KPI)
  </text>

  <!-- KPI Gauge Meter -->
  <g transform="translate(46, 66)">
    <rect width="124" height="92" rx="8" fill="#1e293b" stroke="#fda4af" stroke-width="1.2"/>
    <path d="M24,68 A38,38 0 0,1 100,68" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    <path d="M24,68 A38,38 0 0,1 90,42" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round"/>
    <line x1="62" y1="68" x2="84" y2="44" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="62" cy="68" r="5" fill="#fb7185"/>
    <text x="62" y="85" text-anchor="middle" fill="#fda4af" font-family="sans-serif" font-size="10" font-weight="bold">Strategic KPI 94%</text>
  </g>

  <!-- Drill-down & Market Trend Card -->
  <g transform="translate(184, 66)">
    <rect width="130" height="92" rx="8" fill="#1e293b" stroke="#fda4af" stroke-width="1.2"/>
    <text x="65" y="18" text-anchor="middle" fill="#fecdd3" font-family="sans-serif" font-size="10" font-weight="bold">Market &amp; Drill-Down</text>
    <polyline points="16,66 44,52 72,56 100,32 116,26" fill="none" stroke="#fb7185" stroke-width="3"/>
    <circle cx="100" cy="32" r="5" fill="#fde047"/>
    <rect x="20" y="72" width="90" height="12" rx="4" fill="#e11d48"/>
    <text x="65" y="81" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold">🔍 DRILL-DOWN VIEW</text>
  </g>

  <rect x="16" y="186" width="328" height="24" rx="6" fill="#4c0519" opacity="0.9"/>
  <text x="180" y="202" text-anchor="middle" fill="#fecdd3" font-family="sans-serif" font-size="12" font-weight="bold">
    EIS / ESS • ระบบสารสนเทศผู้บริหารระดับสูง (Strategic KPI)
  </text>
</svg>
